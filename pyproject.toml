[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architectural-converter"
version = "1.0.0"
description = "Deterministic DWG/DXF architectural feature extraction (Phase 1) and 3D reconstruction (Phase 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ezdxf>=1.3", "shapely>=2.0", "networkx>=3.2", "numpy>=1.26", "trimesh>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
architectural-converter = "architectural_converter.__main__:main"

[tool.setuptools.packages.find]
include = ["architectural_converter*", "sympoint_converter*"]

[tool.setuptools.package-data]
architectural_converter = ["config/*.json", "benchmark/*.json", "benchmark/drawings/*"]
sympoint_converter = ["config.json", "service/*", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
